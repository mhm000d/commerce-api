services:
  api:
    build:
      context: .
      dockerfile: Commerce.Api/Dockerfile
    container_name: commerce-api
    profiles:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-commerceDb};Username=${POSTGRES_USER:-commerce_user};Password=${POSTGRES_PASSWORD:-commerce_password}
      Jwt__Key: ${JWT_KEY:-CommerceDevelopmentSigningKey-ChangeMe-ForLocalOnly-1234567890}
      Jwt__Issuer: ${JWT_ISSUER:-CommerceApi}
      Jwt__Audience: ${JWT_AUDIENCE:-CommerceClient}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-https://localhost:3000}
      RateLimiting__Enabled: ${RATE_LIMITING_ENABLED:-true}
      RateLimiting__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RateLimiting__AnonymousPermitLimit: ${RATE_LIMIT_ANONYMOUS_PERMIT_LIMIT:-120}
      RateLimiting__AuthenticatedPermitLimit: ${RATE_LIMIT_AUTHENTICATED_PERMIT_LIMIT:-600}
      RateLimiting__AuthEndpointPermitLimit: ${RATE_LIMIT_AUTH_ENDPOINT_PERMIT_LIMIT:-30}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-noreply@commerce.local}
      Email__FromName: ${EMAIL_FROM_NAME:-Commerce Store}
      Email__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
      AWS__Region: ${AWS_REGION:-eu-west-1}
      FileUpload__S3__BucketName: ${S3_BUCKET_NAME:-commerce-product-images-local}
      FileUpload__Cdn__Domain: ${CDN_DOMAIN:-}
      FileUpload__S3__Region: ${AWS_REGION:-eu-north-1}
    ports:
      - "5082:8080"
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: commerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_password}
      POSTGRES_DB: ${POSTGRES_DB:-commerceDb}
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.30
    container_name: commerce-mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

